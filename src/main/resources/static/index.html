<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice game websocket</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="usernameAreaDiv" class="username-input">
    <label for="username">Enter Username:</label>
    <input type="text" id="username" placeholder="Your Username">
    <button id="setUsername">Join</button>
</div>

<div id="system-msg" hidden>
    <p id="message"></p>
    <h2 id="winner"></h2>
</div>

<div id="score-area" hidden>
    <div>Your score: <span id="scoreYou"></span></div>
    <div>Other player score: <span id="scoreOther"></span></div>
</div>

<br>
<div id="game-area">
    <div class="diceDiv">
        <h2>Dice 1 </h2>
        <div class="dice">
            <img id="dice1Image" src="images/0.png" alt="Dice image" width="140" height="140">
        </div>
    </div>

    <div class="diceDiv">
        <h2>Dice 2</h2>
        <div class="dice">
            <img id="dice2Image" src="images/0.png" alt="Dice image" width="140" height="140">
        </div>
    </div>

</div>

<button id="roll-dice" hidden>Roll Dice</button>

</body>
</html>
